# Delivery recipe, independent of the environment used for internal measurements.
# Replace image, build commands/paths and mounts using the tested version's docs.
xtask_reproduction:
  image: quay.io/jd_xllm/xllm-ai:REPLACE_WITH_PINNED_IMAGE
  source_url: https://github.com/xllm-ai/xllm.git
  xtask_url: https://github.com/Vectorwh/xTask.git
  pull: true
  host_python: python3
  python: python3
  sources:
    - /usr/local/Ascend/ascend-toolkit/set_env.sh
    - /usr/local/Ascend/nnal/atb/set_env.sh
  container:
    binds:
      - /models:/models:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
    host_config:
      NetworkMode: host
      IpcMode: host
      ShmSize: 68719476736
      Devices:
        - {PathOnHost: /dev/davinci0, PathInContainer: /dev/davinci0, CgroupPermissions: rwm}
        - {PathOnHost: /dev/davinci1, PathInContainer: /dev/davinci1, CgroupPermissions: rwm}
        - {PathOnHost: /dev/davinci_manager, PathInContainer: /dev/davinci_manager, CgroupPermissions: rwm}
        - {PathOnHost: /dev/devmm_svm, PathInContainer: /dev/devmm_svm, CgroupPermissions: rwm}
        - {PathOnHost: /dev/hisi_hdc, PathInContainer: /dev/hisi_hdc, CgroupPermissions: rwm}
  build:
    binary: build/lib.linux-aarch64-cpython-311/xllm/xllm
    build_dir: build
    gate_args:
      - --configure-command
      - python3 setup.py build
      - --incremental-command
      - cmake --build @@REPO@@/build --target xllm -j 16
      - --opp-marker
      - /usr/local/Ascend/ascend-toolkit/latest/opp/vendors/custom_xllm_math/.xllm_ops_git_head
      - --opp-package-root
      - '@@REPO@@/third_party/xllm_ops/build_out/packages/vendors/custom_xllm_math'
  mtp: {model_type: qwen3_5}
  setup:
    - command: [python3, -m, pip, install, -r, '@@RUN_ROOT@@/tools/xTask/requirement.txt']
      context: {python: python3}
  # Raw weights/datasets may already exist, or be downloaded at a pinned revision.
  # Add hashes for formal evidence. Credentials belong in the local environment.
  resources: []
  # These effective JSON values travel inside the delivered YAML. The adapter
  # generates isolated JSON files; recipients need no copy of your local JSONs.
  task_config:
    ENV_CONFIG:
      CLEAN_RESULTS: false
      DEPENDENCE_PACKAGE_PATH: ''
      XTask_LOG_LEVEL: INFO
      LOG_PATH: logs
      python_exec: python3
      pip_exec: pip3
      docker_cmd: docker
    DOCKER_CONFIG: {volumes: {}, enable_proxy: false}
